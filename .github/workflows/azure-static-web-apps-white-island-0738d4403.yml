name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
      - build

jobs:
  validate_pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Validate Pull Request
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          lfs: false
      # Keep pull requests off Azure's limited preview-environment quota.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy_production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        env:
          # This public repository variable is compiled into Vite's static
          # build. It is an API origin, not a credential. Leaving it unset
          # keeps the bundled fallback gallery data active.
          VITE_GALLERY_API_URL: ${{ vars.GALLERY_API_BASE_URL }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_ISLAND_0738D4403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory
          ###### End of Repository/Build Configurations ######

  close_legacy_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Legacy Preview Environment
    steps:
      # New pull requests no longer have previews; ignore a missing legacy environment.
      - name: Close Azure Preview Environment
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_ISLAND_0738D4403 }}
          action: "close"
